# for config file options, refer to
# https://docs.daml.com/tools/assistant.html#project-config-file-daml-yaml

sdk-version: 3.4.11
name: umbra-v8
source: daml
init-script: UmbraTest:umbraDemo
version: 0.1.0
dependencies:
  - daml-prim
  - daml-stdlib
  - daml-script
data-dependencies:
  # Official 1.0.0 Splice token-standard DARs (from the splice-node release bundle).
  # allocation-v1 package-id = 93c942ae..., matching the real registry allocation, so
  # Umbra's ExecuteRealSwap exercises the SAME AllocationV1 interface the registry uses.
  # allocation-instruction dropped: Umbra's Daml does not use it.
  - vendor/registry-1.0.0/splice-api-token-metadata-v1-1.0.0.dar
  - vendor/registry-1.0.0/splice-api-token-holding-v1-1.0.0.dar
  - vendor/registry-1.0.0/splice-api-token-allocation-v1-1.0.0.dar
