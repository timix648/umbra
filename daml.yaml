# for config file options, refer to
# https://docs.daml.com/tools/assistant.html#project-config-file-daml-yaml

sdk-version: 3.4.11
name: umbra-v9
source: daml
init-script: UmbraTest:umbraDemo
# 0.2.0: SwapProposal now carries real settlement deadlines and a unique trade id,
# so the CIP-56 AllocationRequest view reports them instead of invented constants.
# Bumped rather than reusing 0.1.0 so this package is distinguishable on-ledger
# from the already-vetted 0.1.0 build.
# 0.2.1: InviteDealer's assertion message stated the opposite of what it checks.
# Body-only change, no schema change, so it upgrades cleanly from 0.2.0 -- and the
# backend addresses templates as #umbra-v9:... so it picks this up without edits.
# 0.2.2: SubmitSwapQuote and AcceptSwapQuote now fetch the SwapRfq they answer, so a
# cancelled request can no longer be quoted or lifted. CancelRfq archived only the RFQ;
# invitations and quotes are separate contracts and outlived it. Body-only again.
# 0.5.0: adds UmbraGovernance, which wraps the operator-only registry choices
# (ListAsset, DelistAsset, SetParticipants) as GovernableAction proposals so a
# decentralized party can put multi-sig on them. Bumped rather than reusing
# 0.4.0 because 0.4.0 is already uploaded to two ledgers and a rebuild under the
# same version would be a different package with the same name.
version: 0.5.0
dependencies:
  - daml-prim
  - daml-stdlib
  - daml-script
data-dependencies:
  # Registry-matched token-standard packages, pulled directly from the participant
  # via GET /v2/packages/{id} (their sha256 == the package-id, so these ARE the exact
  # packages the DevNet registry uses). allocation-v1 = 93c942ae... matches the real
  # registry allocation, so Umbra's ExecuteRealSwap exercises the SAME AllocationV1
  # interface the registry implements (fixes CONTRACT_DOES_NOT_IMPLEMENT_INTERFACE).
  # .dalf files are accepted directly in data-dependencies (no DAR wrapping needed).
  # allocation-instruction omitted: UmbraSwap.daml imports only Allocation/Holding/Metadata.
  - vendor/registry-matched/splice-api-token-metadata-v1-4ded6b66.dalf
  - vendor/registry-matched/splice-api-token-holding-v1-718a0f77.dalf
  - vendor/registry-matched/splice-api-token-allocation-v1-93c942ae.dalf
  # allocation-request 1.0.0 (6fe84853) -- lets Umbra implement AllocationRequest
  # so a standard Canton wallet can render + sign each swap leg (Trojan Horse).
  - vendor/registry-matched/splice-api-token-allocation-request-v1-6fe84853.dalf
  - vendor/registry-matched/daml-stdlib-9d1a644e.dalf
  - vendor/registry-matched/daml-prim-54f85ebf.dalf
  # BitSafe's Decentralization Manager governance interface, extracted from the
  # published release DAR (decentralization-manager, hackathon branch,
  # releases/v1/governance-action-v1-0.1.0.dar). Kept as a .dalf like the
  # registry-matched packages above, because .gitignore excludes vendor/**/*.dar
  # as build output and a submission has to build from a clean clone.
  # SDK 3.4.11, target 2.2 -- same as this project -- and it depends only on
  # daml-prim/daml-stdlib, so it adds no transitive weight.
  - vendor/governance/governance-action-v1-48acd500.dalf

build-options:
  - --package=splice-api-token-holding-v1-1.0.0
  - --package=splice-api-token-metadata-v1-1.0.0
  - --package=splice-api-token-allocation-v1-1.0.0
  - --package=splice-api-token-allocation-request-v1-1.0.0
  # A .dalf ships without the metadata a .dar carries, so the package has to be
  # exposed explicitly or its module is hidden -- same as the four above.
  - --package=governance-action-v1-0.1.0
